services:
  # ------ INFRAESTRUTURA ------
  postgres_db:
    image: postgres:13-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=main_db
    ports:
      - "5432:5432"
    networks:
      - app-network
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    
  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network

  # ------ SERVIÇOS DA APLICAÇÃO ------
  auth-service:
    build: ./api_autenticacao
    container_name: auth-service
    command: python manage.py runserver 0.0.0.0:8001
    env_file: .env
    volumes:
      - ./api_autenticacao:/app
    ports:
      - "8001:8001"
    networks:
      - app-network

  # NOVO SERVIÇO DE BANCO DE DADOS (GUARDIÃO DOS DADOS)
  db-service:
    build: ./servico_banco_dados
    container_name: db-service
    command: sh -c "python manage.py migrate && gunicorn db_project.wsgi:application --bind 0.0.0.0:8002"
    env_file: .env
    ports:
      - "8002:8002"
    environment:
      - DB_NAME=main_db
      - DB_USER=myuser
      - DB_PASS=mypassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
    
    restart: on-failure 
    depends_on:
      postgres_db:
        condition: service_healthy 
    networks:
      - app-network
  

  # WORKER DE PERMISSÃO (AGORA STATELESS)
  permission-worker:
    build: ./servico_permissao
    container_name: permission-worker
    command: celery -A servico_permissao.celery worker --loglevel=info
    env_file: .env
    volumes:
      - ./servico_permissao:/app
    # --- ADIÇÃO IMPORTANTE ---
    restart: on-failure
    depends_on:
      db-service:
        condition: service_started # Espera o db_service iniciar
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    # -------------------------
    networks:
      - app-network
  
  middleware:
    build: ./middleware
    container_name: middleware
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./middleware:/app
    depends_on:
      - rabbitmq
      - permission-worker
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: