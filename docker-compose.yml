services:
  # --- Infraestrutura Existente ---
  postgres_db:
    image: postgres:13-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=main_db
      - TZ=America/Sao_Paulo
      - PGTZ=America/Sao_Paulo
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8
    container_name: emqx
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      - "EMQX_NAME=emqx-node1"
      - "EMQX_HOST=emqx"
      - "EMQX_ALLOW_ANONYMOUS=true"
    volumes:
      - emqx_data:/opt/emqx/data
    networks:
      - app-network

  # --- KONG API GATEWAY ---
  kong-database:
    image: postgres:13-alpine
    container_name: kong-database
    networks:
      - app-network
    environment:
      - POSTGRES_USER=kong
      - POSTGRES_DB=kong
      - POSTGRES_PASSWORD=kongpass
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # O ERRO PROVAVELMENTE ESTAVA AQUI (Indentação ou bloco faltando)
  kong-migration:
    image: kong:3.4
    container_name: kong-migration
    command: "kong migrations bootstrap"
    networks:
      - app-network
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kongpass
    depends_on:
      kong-database:
        condition: service_healthy

  kong-configurator:
    image: curlimages/curl:latest
    container_name: kong-configurator
    restart: on-failure # CORRIGIDO AQUI
    volumes:
      - ./init_kong.sh:/init_kong.sh
    entrypoint: ["/bin/sh", "/init_kong.sh"]
    networks:
      - app-network
    depends_on:
      kong:
        condition: service_started

  kong:
    image: kong:3.4
    container_name: kong
    user: "kong"
    networks:
      - app-network
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=kong-database
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=kongpass
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_ADMIN_GUI_URL=http://localhost:8002
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    depends_on:
      kong-migration:
        condition: service_completed_successfully

  # --- APIs ---
  middleware:
    build: ./middleware
    container_name: middleware
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=middleware
      - LOG_LEVEL=INFO
      - DB_SERVICE_URL=http://servico-banco-dados:8002/api
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  servico-autenticacao:
    build: ./servico-autenticacao
    container_name: servico-autenticacao
    command: python manage.py runserver 0.0.0.0:8001
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=auth-service
    networks:
      - app-network

  servico-banco-dados:
    build: ./servico-banco-dados
    container_name: servico-banco-dados
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8002"
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=db-service
      - DB_NAME=main_db
      - DB_USER=myuser
      - DB_PASS=mypassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
    restart: on-failure
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - app-network

  # --- Workers ---
  servico-permissao:
    build: ./servico-permissao
    container_name: servico-permissao
    command: celery -A tasks worker --loglevel=info -Q permission_queue
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=permission-worker
    depends_on:
      servico-banco-dados:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  servico-log:
    build: ./servico-log
    container_name: servico-log
    command: celery -A tasks worker --loglevel=info -Q log_queue
    env_file: .env
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=log-worker
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  servico-porta:
    build: ./servico-porta
    container_name: servico-porta
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - SERVICE_NAME=door-service
      - RABBITMQ_HOST=rabbitmq
      - MQTT_BROKER_HOST=emqx
      - DB_SERVICE_URL=http://servico-banco-dados:8002/api
    networks:
      - app-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      emqx:
        condition: service_started

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  emqx_data:
  rabbitmq_data:
  kong_data: