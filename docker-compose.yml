services:
  postgres_db:
    image: postgres:13-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=main_db
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: redis
    networks:
      - app-network

  auth-service:
    build: ./api_autenticacao
    container_name: auth-service
    command: python manage.py runserver 0.0.0.0:8001
    env_file: .env
    volumes:
      - ./api_autenticacao:/app
    ports:
      - "8001:8001"
    networks:
      - app-network

  db-service:
    build: ./servico_banco_dados
    container_name: db-service
    command: sh -c "python manage.py migrate && gunicorn db_project.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 120"
    env_file: .env
    volumes:
      - ./servico_banco_dados:/app
    ports:
      - "8002:8002"
    environment:
      - DB_NAME=main_db
      - DB_USER=myuser
      - DB_PASS=mypassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
    restart: on-failure 
    depends_on:
      postgres_db:
        condition: service_healthy 
    networks:
      - app-network

  permission-worker:
    build: ./servico_permissao
    container_name: permission-worker
    command: celery -A servico_permissao.celery worker --loglevel=info
    env_file: .env
    volumes:
      - ./servico_permissao:/app
    restart: on-failure
    depends_on:
      db-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  log-worker:
    build: ./servico_de_log
    container_name: log-worker
    command: celery -A log_project.celery worker -Q log_queue --loglevel=info
    env_file: .env
    volumes:
      - ./servico_de_log:/app
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-service:
        condition: service_started
    networks:
      - app-network

  middleware:
    build: ./middleware
    container_name: middleware
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./middleware:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      permission-worker:
        condition: service_started
    networks:
      - app-network
  emqx:
      image: emqx/emqx:5.1.0
      container_name: emqx
      ports:
        - "1883:1883"      # Porta padrão MQTT
        - "8083:8083"      # WebSocket
        - "8084:8084"      # WebSocket SSL
        - "8883:8883"      # MQTT SSL
        - "18083:18083"    # Dashboard/API HTTP
      environment:
        - "EMQX_NAME=emqx-node1"
        - "EMQX_HOST=emqx"
        # Desabilitar autenticação para desenvolvimento. Em produção, isso deve ser configurado.
        - "EMQX_ALLOW_ANONYMOUS=true" 
      networks:
        - app-network
      healthcheck:
        test: ["CMD", "/opt/emqx/bin/emqx_ctl", "status"]
        interval: 15s
        timeout: 10s
        retries: 10

  mqtt-communication-service:
    build: ./servico_comunicacao_MQTT
    container_name: mqtt-communication-service
    command: python main.py
    restart: on-failure
    env_file: .env
    environment:
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_QUEUE=mqtt_commands
    depends_on:
      rabbitmq:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - app-network


networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: