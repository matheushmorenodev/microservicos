services:
  # ======================================================================================
  #                           Serviços de Infraestrutura
  # ======================================================================================
  postgres_db:
    image: postgres:13-alpine
    container_name: postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=myuser
      - POSTGRES_PASSWORD=mypassword
      - POSTGRES_DB=main_db
    ports:
      - "5432:5432" # Mantido para depuração local
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Porta para os workers Celery
      - "15672:15672" # Interface de gerenciamento
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  emqx:
    image: emqx/emqx:5.8.8
    container_name: emqx
    ports:
      - "1883:1883"    # Porta padrão MQTT
      - "18083:18083"  # Dashboard/API HTTP
      # - "8083:8083"    # WebSocket (opcional)
      # - "8883:8883"    # MQTT SSL (opcional)
    environment:
      - "EMQX_NAME=emqx-node1"
      - "EMQX_HOST=emqx"
      - "EMQX_ALLOW_ANONYMOUS=true" # Apenas para desenvolvimento
    networks:
      - app-network
    # healthcheck:
    #   test: ["CMD", "nc", "-z", "localhost", "1883"]
    #   interval: 10s
    #   timeout: 5s
    #   retries: 10

  # ======================================================================================
  #                           Serviços de API (Interface)
  # ======================================================================================
  auth-service:
    build: ./api_autenticacao
    container_name: auth-service
    # AVISO: 'runserver' não é para produção. Use Gunicorn como no 'db-service'.
    command: python manage.py runserver 0.0.0.0:8001
    env_file: .env
    volumes:
      - ./api_autenticacao:/app # Volume para hot-reload em dev
    ports:
      - "8001:8001"
    networks:
      - app-network

  middleware:
    build: ./middleware
    container_name: middleware
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./middleware:/app # Volume para hot-reload em dev
    depends_on:
      rabbitmq:
        condition: service_healthy
      permission-service: # Espera o worker de permissão iniciar
        condition: service_started
    networks:
      - app-network

  # ======================================================================================
  #                           Serviços de Lógica (Workers)
  # ======================================================================================
  db-service:
    build: ./servico_banco_dados
    container_name: db-service
    # Comando correto: executa migrações e inicia o servidor Gunicorn
    command: sh -c "python manage.py migrate && gunicorn db_project.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 120"
    env_file: .env # As variáveis de DB devem estar no seu arquivo .env
    volumes:
      - ./servico_banco_dados:/app # Volume para hot-reload em dev
    ports:
      - "8002:8002"
    environment:
      - DB_NAME=main_db
      - DB_USER=myuser
      - DB_PASS=mypassword
      - DB_HOST=postgres_db
      - DB_PORT=5432
    restart: on-failure
    depends_on:
      postgres_db: # Garante que o banco de dados esteja pronto
        condition: service_healthy
    networks:
      - app-network

  permission-service:
    build: ./permission_service
    container_name: permission-service
    # AJUSTE CRÍTICO: Comando para rodar o worker Celery
    # Aponta para o app 'tasks' e escuta a fila 'permission_queue'
    command: celery -A tasks worker --loglevel=info -Q permission_queue
    env_file: .env
    volumes:
      - ./permission_service:/app
    restart: on-failure
    depends_on:
      db-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network

  log-service:
    build: ./log_service
    container_name: log-service
    # AJUSTE CRÍTICO: Comando para rodar o worker Celery
    # Aponta para o app 'tasks' e escuta a fila 'log_queue'
    command: celery -A tasks worker --loglevel=info -Q log_queue
    env_file: .env
    volumes:
      - ./log_service:/app
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-service:
        condition: service_started
    networks:
      - app-network

  door-service:
    build: ./door_service
    container_name: door-service
    # AJUSTE CRÍTICO: Comando para rodar o worker Celery
    # Aponta para o app 'tasks' e escuta a fila 'door_commands'
    command: celery -A tasks worker --loglevel=info -Q door_commands
    restart: on-failure
    env_file: .env # As variáveis de MQTT/DB devem estar no seu .env
    volumes:
      - ./door_service:/app
    depends_on:
      rabbitmq:
        condition: service_healthy
      emqx:
        condition: service_started
    networks:
      - app-network

# ======================================================================================
#                                 Redes e Volumes
# ======================================================================================
networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    # O driver 'local' é o padrão, não precisa ser especificado